apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ml-monitor
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ml-api-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: ml-monitor
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ml-api-monitor
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: ml-monitor
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ml-api-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ml-monitor
