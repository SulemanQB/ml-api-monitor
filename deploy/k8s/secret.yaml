apiVersion: v1
kind: Secret
metadata:
  name: ml-api-settings
  namespace: ml-monitor
  labels:
    app.kubernetes.io/name: ml-api
    app.kubernetes.io/part-of: ml-api-monitor
type: Opaque
stringData:
  # Public drift threshold. This repository has no credentials.
  # The process reads DRIFT_THRESHOLD from the environment, so the value
  # can change without editing the Deployment.
  DRIFT_THRESHOLD: "0.05"
