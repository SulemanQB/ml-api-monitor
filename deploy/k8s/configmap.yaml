apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-api-config
  namespace: ml-monitor
  labels:
    app.kubernetes.io/name: ml-api
    app.kubernetes.io/part-of: ml-api-monitor
data:
  MODEL_NAME: tiny-color
  DRIFT_METHOD: ks
  BASELINE_WINDOW: "20"
  RECENT_WINDOW: "20"
  MAX_UPLOAD_BYTES: "5000000"
  MAX_IMAGE_PIXELS: "4000000"
  LOG_LEVEL: INFO
